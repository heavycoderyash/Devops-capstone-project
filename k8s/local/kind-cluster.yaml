# Local Kubernetes for rehearsing the demo before touching AWS:
#   kind create cluster --config k8s/local/kind-cluster.yaml
# Ports 80/443 on your laptop are forwarded to the ingress controller.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: medislot
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 80, protocol: TCP}
      - {containerPort: 443, hostPort: 443, protocol: TCP}
  - role: worker
