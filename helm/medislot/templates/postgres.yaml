{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medislot.postgresService" . }}
  labels:
    {{- include "medislot.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "medislot.selectorLabels" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "medislot.postgresService" . }}
  labels:
    {{- include "medislot.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "medislot.postgresService" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "medislot.selectorLabels" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medislot.componentLabels" (list . "postgres") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 70        # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70          # makes the EBS volume writable for that user
        {{- include "medislot.podSecurityContext" . | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            {{- include "medislot.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "medislot.secretName" . }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql   # Postgres 18+ stores data in a versioned subdirectory
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
