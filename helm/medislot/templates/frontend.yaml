apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "medislot.frontendService" . }}
  labels:
    {{- include "medislot.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "medislot.selectorLabels" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medislot.componentLabels" (list . "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "medislot.podSecurityContext" . | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "medislot.image" (list . .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- include "medislot.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Nginx proxies /api here when the frontend Service is reached directly.
            - name: BACKEND_URL
              value: {{ printf "http://%s:8000" (include "medislot.backendService" .) | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medislot.frontendService" . }}
  labels:
    {{- include "medislot.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "medislot.selectorLabels" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
