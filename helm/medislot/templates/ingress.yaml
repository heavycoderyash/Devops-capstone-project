{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medislot.fullname" . }}
  labels:
    {{- include "medislot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # /api -> FastAPI, everything else -> React (Nginx)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "medislot.backendService" . }}
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "medislot.frontendService" . }}
                port: {name: http}
{{- end }}
