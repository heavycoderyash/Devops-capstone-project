{{- if .Values.monitoring.grafanaDashboard.enabled }}
# The kube-prometheus-stack Grafana sidecar loads every ConfigMap labelled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medislot.fullname" . }}-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "medislot.labels" . | nindent 4 }}
data:
  medislot-dashboard.json: |-
{{ .Files.Get "files/medislot-dashboard.json" | indent 4 }}
{{- end }}
