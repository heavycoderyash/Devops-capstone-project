{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "backend" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "medislot.fullname" $ }}-{{ $component }}
  labels:
    {{- include "medislot.componentLabels" (list $ $component) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "medislot.selectorLabels" (list $ $component) | nindent 6 }}
{{- end }}
{{- end }}
