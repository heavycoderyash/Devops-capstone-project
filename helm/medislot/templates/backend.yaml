apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "medislot.backendService" . }}
  labels:
    {{- include "medislot.componentLabels" (list . "backend") | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "medislot.selectorLabels" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medislot.componentLabels" (list . "backend") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "medislot.podSecurityContext" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "medislot.image" (list . .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "medislot.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RUN_MIGRATIONS
              value: {{ if .Values.migrations.enabled }}"false"{{ else }}"true"{{ end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "medislot.secretName" . }}
                  key: DATABASE_URL
            {{- with .Values.backend.corsOrigins }}
            - name: CORS_ORIGINS
              value: {{ . | quote }}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medislot.backendService" . }}
  labels:
    {{- include "medislot.componentLabels" (list . "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "medislot.selectorLabels" (list . "backend") | nindent 4 }}
  ports:
    - name: http          # the ServiceMonitor scrapes this named port
      port: 8000
      targetPort: http
