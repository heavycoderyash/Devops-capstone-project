{{- $password := required "postgres.password is required (pass it with --set postgres.password=...)" .Values.postgres.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medislot.secretName" . }}
  labels:
    {{- include "medislot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.postgres.username (urlquery $password) (include "medislot.dbHost" .) .Values.postgres.port .Values.postgres.database | quote }}
