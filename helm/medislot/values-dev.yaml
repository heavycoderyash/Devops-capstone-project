# Local cluster (kind / minikube / Docker Desktop):
#   helm upgrade --install medislot ./helm/medislot -n medislot --create-namespace \
#     -f helm/medislot/values-dev.yaml --set postgres.password=devpassword
backend:
  image:
    repository: medislot-backend
    tag: local
    pullPolicy: IfNotPresent
frontend:
  image:
    repository: medislot-frontend
    tag: local
    pullPolicy: IfNotPresent
ingress:
  enabled: true
  host: medislot.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
